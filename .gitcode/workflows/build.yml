name: build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request: # PR 触发构建验证
    branches:
      - "*"
  pull_request_comment:
    types: [created]
    comments: ["/build"]
    branches:
      - "*"

permissions:
  repository: read

jobs:
  build:
    runs-on: ["self-hosted", "default"]
    steps:
      - name: checkout
        uses: checkout
        with:
          ref: ${{ atomgit.event.pull_request.merge_commit_sha || atomgit.event.pull_request.head.sha || atomgit.sha }}

      - name: Build
        run: |
          npm ci
          npm run build
